name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/WhatsAppMetaBot.csproj

      - name: Build
        run: dotnet build src/WhatsAppMetaBot.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/WhatsAppMetaBot.Tests/WhatsAppMetaBot.Tests.csproj -c Release
